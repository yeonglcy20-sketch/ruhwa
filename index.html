<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>집사의 업보일지</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="night-scene" aria-hidden="true"><div class="moon"></div><div class="stars"></div><div class="cloud cloud-a"></div><div class="cloud cloud-b"></div></div>
<div class="container">
  <header class="hero">
    <div><h1><span class="cat-mark" aria-hidden="true">🐾</span> <span>집사의 업보일지</span></h1><p class="subtitle">달빛 아래 차곡차곡 모아둔 냥냥이의 비밀 기록</p></div>
    <div class="hero-art"><img class="cat-portrait" src="pink_cat_portrait.png" alt="분홍 고양이 스트리머 캐릭터"><span class="art-sparkle">✦ ✧</span></div>
  </header>
  <input id="searchInput" type="search" placeholder="🐾 집사의 기록 찾아보기..." aria-label="닉네임 또는 업보 검색">
  <section id="list" class="card-list" aria-label="업보 목록"></section>
  <footer class="sea-caption">✦ 달빛에 남겨진 작은 약속들 ✦</footer>
</div>
<script src="script.js"></script>
</body>
</html>
