<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>집사의 업보일지</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="night-scene" aria-hidden="true"><div class="moon"></div><div class="stars"></div></div>
<div class="container">
  <header class="hero">
    <div><p class="eyebrow">PINK MOON · CAT DIARY</p><h1>집사의 업보일지</h1><p class="subtitle">분홍빛 별 아래, 집사의 약속을 모아두는 곳</p></div>
    <img class="cat-mascot" src="pink-cat.png" alt="검은 리본을 단 귀여운 분홍 고양이">
  </header>
  <input id="searchInput" type="search" placeholder="집사의 이름이나 업보를 찾아보세요…" aria-label="닉네임 또는 업보 검색">
  <section id="list" class="card-list" aria-label="업보 목록"></section>
  <footer class="night-caption">별빛이 잠든 밤, 고양이와 함께 쓰는 작은 일지</footer>
</div>
<script src="script.js"></script>
</body>
</html>
