<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>집사의 업보일지</title>
<link rel="stylesheet" href="theme-mobile-full.css">
</head>
<body>
<div class="night-scene" aria-hidden="true"><div class="moon"></div><div class="stars"></div></div>
<div class="container">
  <header class="hero">
    <img width="1200" height="260" class="header-art" src="cat-girls-header.png" alt="">
    <div class="hero-copy"><p class="eyebrow">✦ PINK MOON · CAT DIARY ✦</p><h1>집사의 업보일지 <span class="title-paw">🐾</span></h1><p class="subtitle">오늘도 쌓인 작은 약속들… 집사가 다 기억하고 있어요 ♡</p></div>
    
  </header>
  <div class="search-box"><span aria-hidden="true">🐾</span><input id="searchInput" type="search" placeholder="집사의 업보 기록 찾기…" aria-label="닉네임 또는 업보 검색"><button class="search-button" aria-label="검색" type="button">⌕</button></div>
  <div class="workspace"><main class="records"><div class="toolbar"><div class="tabs" role="group" aria-label="기록 필터"><button class="active" data-filter="all" aria-pressed="true">전체</button><button data-filter="debt" aria-pressed="false">업보</button><button data-filter="remaining" aria-pressed="false">남음</button><button data-filter="due" aria-pressed="false">만기일</button></div><select id="sortSelect" aria-label="정렬"><option value="name">🐾 닉네임순</option><option value="count">업보 많은순</option><option value="due">만기일 가까운순</option></select></div><p id="resultCount" class="result-count" aria-live="polite"></p><section id="list" class="card-list" aria-label="업보 목록"></section><nav id="pagination" class="pagination" aria-label="목록 페이지"></nav></main><aside id="detailSlot" class="detail-slot"><img width="360" height="160" class="panel-girl slot-girl" src="panel-girl.png" alt="분홍 고양이 소녀"><div class="panel-placeholder"><span class="panel-bow" aria-hidden="true">୨୧</span><p class="placeholder-title">🐾 집사의 작은 기록 🐾</p><div class="placeholder-row">🐾 업보 <span>—</span></div><div class="placeholder-row">♡ 남음 <span>—</span></div><div class="placeholder-row">▦ 만기일 <span>—</span></div><small>닉네임 카드를 누르면<br>집사의 약속을 확인할 수 있어요 ♡</small><img width="112" height="87" class="panel-kitten" src="pink-cat.png" alt=""></div></aside></div>
  <footer class="night-caption">별빛이 잠든 밤, 고양이와 함께 쓰는 작은 일지</footer>
</div>
<script src="diary-size-fixed.js"></script>
</body>
</html>
