<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>집사의 업보일지</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="night-scene" aria-hidden="true"><div class="moon"></div><div class="stars"></div></div>
<div class="container">
  <header class="hero">
    <img class="hero-cat cat-left" src="pink-cat.png" alt="">
    <div class="hero-copy"><p class="eyebrow">✦ PINK MOON · CAT DIARY ✦</p><h1>집사의 업보일지 <span class="title-paw">🐾</span></h1><p class="subtitle">오늘도 쌓인 작은 약속들… 집사가 다 기억하고 있어요 ♡</p></div>
    <img class="hero-cat cat-right" src="pink-cat.png" alt="귀여운 분홍 고양이">
  </header>
  <div class="search-box"><span aria-hidden="true">🐾</span><input id="searchInput" type="search" placeholder="집사의 업보 기록 찾기…" aria-label="닉네임 또는 업보 검색"><span class="search-spark" aria-hidden="true">✧</span></div>
  <p class="list-hint">✦ 닉네임 카드를 누르면 자세한 기록을 볼 수 있어요 ✦</p>
  <section id="list" class="card-list" aria-label="업보 목록"></section>
  <footer class="night-caption">별빛이 잠든 밤, 고양이와 함께 쓰는 작은 일지</footer>
</div>
<script src="script.js"></script>
</body>
</html>
